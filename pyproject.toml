[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riphammer"
version = "0.1.0"
description = "Multi-band NMF for cell-type-specific TAD extraction from bulk Hi-C"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Koki Tsuyuzaki", email = "koki.tsuyuzaki@gmail.com" },
]
keywords = ["Hi-C", "NMF", "TAD", "deconvolution", "chromatin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "cooler>=0.9",
    "cooltools>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
riphammer = "riphammer.cli:main"

[project.urls]
Homepage = "https://github.com/chiba-ai-med/RIPHAMMER"
